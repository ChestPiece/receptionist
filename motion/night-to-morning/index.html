<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=1000" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face{font-family:"Geist";font-weight:100 900;src:url("assets/fonts/geist.woff2") format("woff2")}
      /* Shot spec: docs/superpowers/specs/2026-10-30-landing-redesign-design.md section 10 (branch landing-redesign).
         Palette from the spec's token list, kept inside the composition only. No blue, red or purple. */
      :root{
        --night:#0d1210;--stone:#1c1917;--stone-2:#292524;--sage-glow:#93b59d;--sage:#4f6f5c;--sage-soft:#dfe8df;
        --sand:#e9c9a8;--paper:#fafaf9;--white:#ffffff;--ink:#0c0a09;
      }
      *{margin:0;padding:0;box-sizing:border-box}
      html,body{width:1600px;height:1000px;overflow:hidden;background:var(--night)}
      #root{position:relative;width:100%;height:100%;overflow:hidden;background:var(--night);font-family:"Geist",sans-serif}
      .abs{position:absolute}
      /* camera: slow 4% push-in centred on the phone (50% / 58%) */
      #cam{position:absolute;inset:0;transform-origin:800px 580px}
      /* back wall band starts below the top 20% safe zone */
      #wall{left:-40px;right:-40px;top:215px;height:125px;background:#111613}
      #window{left:170px;top:226px;width:300px;height:100px;border-radius:3px;background:#161c19;overflow:hidden}
      #slats{inset:0;background:repeating-linear-gradient(180deg,rgb(250 250 249 / .05) 0 6px,transparent 6px 11px)}
      #desk{left:-40px;right:-40px;top:340px;bottom:-40px;background:var(--stone)}
      #desk-edge{left:-40px;right:-40px;top:338px;height:4px;background:var(--stone-2)}
      /* cold faint street light falling through the blinds at night */
      #street{left:120px;top:340px;width:900px;height:520px;transform:skewX(-28deg);
        background:repeating-linear-gradient(180deg,rgb(245 245 244 / .035) 0 16px,transparent 16px 34px);
        -webkit-mask-image:linear-gradient(90deg,#000,transparent 85%);mask-image:linear-gradient(90deg,#000,transparent 85%)}
      /* morning: sand stripes from the blinds sweep across the desk */
      #stripes{left:180px;top:330px;width:1250px;height:640px;transform:skewX(-28deg);opacity:0;
        background:repeating-linear-gradient(180deg,rgb(233 201 168 / .9) 0 22px,transparent 22px 46px);
        -webkit-mask-image:radial-gradient(ellipse 50% 50% at 52% 45%,#000 30%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 52% 45%,#000 30%,transparent 100%)}
      #spill{left:560px;top:330px;width:480px;height:500px;border-radius:50%;opacity:0;
        background:radial-gradient(closest-side,rgb(147 181 157 / .38),rgb(147 181 157 / .12) 55%,transparent)}
      /* props, all in the same three-quarter top-down tilt */
      .tilt{transform:perspective(1800px) rotateX(32deg)}
      #pot{left:150px;top:380px;width:150px;height:170px}
      #pot .rim{position:absolute;left:18px;top:70px;width:114px;height:28px;border-radius:50%;background:#171513}
      #pot .body{position:absolute;left:26px;top:84px;width:98px;height:84px;border-radius:0 0 22px 22px;background:#141210}
      #pot .leaf{position:absolute;width:64px;height:30px;border-radius:50%;background:#121a16}
      #book{left:1040px;top:470px;width:250px;height:190px;border-radius:6px;background:var(--stone-2);
        transform:perspective(1800px) rotateX(32deg) rotate(7deg);box-shadow:0 18px 26px -12px rgb(0 0 0 / .55)}
      #book .spine{position:absolute;left:0;top:0;bottom:0;width:20px;border-radius:6px 0 0 6px;background:#221f1d}
      #book .band{position:absolute;left:150px;top:0;bottom:0;width:10px;background:#1f1c1a}
      #pen{left:1010px;top:700px;width:190px;height:9px;border-radius:5px;background:#2f2b28;
        transform:perspective(1800px) rotateX(32deg) rotate(-14deg)}
      #phone-wrap{left:696px;top:362px;width:208px;height:436px;transform:perspective(1800px) rotateX(32deg) rotate(-8deg)}
      #phone{position:absolute;inset:0;border-radius:34px;padding:7px;background:#171412;
        box-shadow:0 0 0 1px #2c2826,0 26px 34px -14px rgb(0 0 0 / .7)}
      #screen{position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;background:#050605}
      .layer{position:absolute;inset:0;opacity:0}
      #lock{background:linear-gradient(180deg,#1d2a23 0%,#0f1613 100%)}
      #time{position:absolute;left:0;right:0;top:56px;text-align:center;color:#f2f1ee;font:200 50px/1 "Geist";letter-spacing:-.04em}
      #notif{position:absolute;left:12px;right:12px;top:150px;height:58px;border-radius:14px;background:rgb(242 241 238 / .16);opacity:0}
      .bar{position:absolute;height:6px;border-radius:3px;background:rgb(242 241 238 / .55)}
      #chat{background:var(--paper)}
      .bub{position:absolute;border-radius:14px;opacity:0}
      #b-patient{right:12px;top:40px;width:120px;height:42px;background:var(--sage)}
      #b-reply{left:12px;top:94px;width:140px;height:54px;background:var(--white);box-shadow:0 0 0 1px #e7e5e4}
      .bub .bar{background:rgb(255 255 255 / .7)}
      #b-reply .bar{background:#d6d3d1}
      #pills{position:absolute;left:12px;right:12px;top:162px;display:flex;gap:6px;opacity:0}
      .pill{flex:1;height:24px;border-radius:12px;background:var(--white);box-shadow:0 0 0 1px #d6d3d1}
      #pill-mid{position:relative}
      #pill-mid i{position:absolute;inset:0;border-radius:12px;background:var(--sage);opacity:0}
      #booked{position:absolute;left:12px;right:12px;top:204px;height:96px;border-radius:16px;background:var(--white);
        box-shadow:0 0 0 1px #e7e5e4,0 14px 22px -12px rgb(12 10 9 / .35);opacity:0}
      #check{position:absolute;left:14px;top:14px;width:30px;height:30px;border-radius:50%;background:var(--sage)}
      #check svg{position:absolute;inset:7px}
      #week{background:var(--white)}
      #grid{position:absolute;left:10px;right:10px;top:46px;bottom:40px;display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
      .col{border-radius:4px;background:#f5f5f4;position:relative}
      #slot{position:absolute;left:0;right:0;top:66%;height:14%;border-radius:4px;background:var(--sage)}
      #week-head{position:absolute;left:10px;top:20px;width:80px;height:8px;border-radius:4px;background:#e7e5e4}
      /* edge falloff: night vignette, then paper toward the edges in the morning so the page's light body continues */
      #vig-night{inset:0;background:radial-gradient(ellipse 70% 62% at 50% 58%,transparent 40%,rgb(13 18 16 / .85) 100%)}
      #vig-day{inset:0;opacity:0;background:radial-gradient(ellipse 66% 60% at 50% 60%,transparent 48%,var(--paper) 96%)}
      #top-night{left:0;right:0;top:0;height:215px;background:var(--night)}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1600" data-height="1000" data-duration="3" data-fps="30">
      <div id="scene" class="abs clip" style="inset:0" data-start="0" data-duration="3" data-track-index="0">
        <div id="cam">
          <div id="wall" class="abs"></div>
          <div id="window" class="abs"><div id="slats" class="abs"></div></div>
          <div id="desk" class="abs"></div>
          <div id="desk-edge" class="abs"></div>
          <div id="street" class="abs"></div>
          <div id="stripes" class="abs"></div>
          <div id="spill" class="abs"></div>
          <div id="pot" class="abs tilt">
            <div class="leaf" style="left:10px;top:30px;transform:rotate(-30deg)"></div>
            <div class="leaf" style="left:70px;top:22px;transform:rotate(25deg)"></div>
            <div class="leaf" style="left:42px;top:4px;transform:rotate(-80deg)"></div>
            <div class="rim"></div><div class="body"></div>
          </div>
          <div id="book" class="abs"><div class="spine"></div><div class="band"></div></div>
          <div id="pen" class="abs"></div>
          <!-- falloff layers sit under the phone so its screen stays the lit object -->
          <div id="vig-night" class="abs"></div>
          <div id="vig-day" class="abs"></div>
          <div id="top-night" class="abs"></div>
          <div id="phone-wrap" class="abs"><div id="phone"><div id="screen">
            <div id="lock" class="layer">
              <div id="time">2:14</div>
              <div id="notif"><div class="bar" style="left:12px;top:16px;width:70px"></div><div class="bar" style="left:12px;top:32px;width:130px;opacity:.6"></div></div>
            </div>
            <div id="chat" class="layer">
              <div id="b-patient" class="bub"><div class="bar" style="left:12px;top:12px;width:90px"></div><div class="bar" style="left:12px;top:24px;width:60px"></div></div>
              <div id="b-reply" class="bub"><div class="bar" style="left:12px;top:12px;width:110px"></div><div class="bar" style="left:12px;top:24px;width:116px"></div><div class="bar" style="left:12px;top:36px;width:70px"></div></div>
              <div id="pills"><div class="pill"></div><div class="pill" id="pill-mid"><i></i></div><div class="pill"></div></div>
              <div id="booked">
                <div id="check"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg></div>
                <div class="bar" style="left:56px;top:18px;width:90px;background:#d6d3d1"></div>
                <div class="bar" style="left:56px;top:32px;width:60px;background:#e7e5e4"></div>
                <div class="bar" style="left:14px;top:62px;width:150px;background:#dfe8df;height:8px;border-radius:4px"></div>
              </div>
            </div>
            <div id="week" class="layer">
              <div id="week-head"></div>
              <div id="grid">
                <div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div>
                <div class="col"><div id="slot"></div></div><div class="col"></div>
              </div>
            </div>
          </div></div></div>
        </div>
      </div>
    </div>
    <script>
      const F = (f) => f / 30; // the spec counts beats in frames
      const tl = gsap.timeline({ paused: true });

      // camera: 4% push-in across all 90 frames
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.04, duration: 3, ease: "none" }, 0);
      // frames 0-29 keep the top 20% flat night; it lifts once the phone is awake
      tl.to("#top-night", { opacity: 0, duration: F(10), ease: "power1.inOut" }, F(30));

      // 15-29 phone wakes: lock screen, sage spill, abstract notification
      tl.to("#lock", { opacity: 1, duration: F(5), ease: "power2.out" }, F(15));
      tl.to("#spill", { opacity: 1, duration: F(10), ease: "power2.out" }, F(15));
      tl.fromTo("#notif", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: F(9), ease: "power3.out" }, F(20));

      // 30-49 chat: patient bubble, reply bubble, three slot pills, middle turns sage
      tl.to("#chat", { opacity: 1, duration: F(4), ease: "power1.inOut" }, F(30));
      tl.to("#lock", { opacity: 0, duration: F(4), ease: "power1.inOut" }, F(30));
      tl.fromTo("#b-patient", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: F(7), ease: "expo.out" }, F(31));
      tl.fromTo("#b-reply", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: F(7), ease: "expo.out" }, F(37));
      tl.fromTo("#pills", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: F(6), ease: "power3.out" }, F(42));
      tl.to("#pill-mid i", { opacity: 1, duration: F(3), ease: "power2.out" }, F(47));

      // 50-59 booking lands, one sage pulse on the desk (peak 54, back by 59)
      tl.fromTo("#booked", { opacity: 0, y: -30, scale: 1.04 }, { opacity: 1, y: 0, scale: 1, duration: F(7), ease: "power3.out" }, F(50));
      tl.to("#spill", { scale: 1.18, opacity: 1, filter: "brightness(1.6)", duration: F(4), ease: "power2.out" }, F(50));
      tl.to("#spill", { scale: 1, filter: "brightness(1)", duration: F(5), ease: "power2.inOut" }, F(54));

      // 60-64 screen dims back to the lock screen; still night
      tl.to("#chat", { opacity: 0, duration: F(2), ease: "power1.in" }, F(60));
      tl.to("#notif", { opacity: 0, duration: F(4), ease: "power1.inOut" }, F(60));
      tl.to("#lock", { opacity: 0.6, duration: F(2), ease: "power1.out" }, F(61));
      tl.to("#spill", { opacity: 0.5, duration: F(4), ease: "power1.inOut" }, F(60));

      // 65-84 morning: exposure ramp (expo.inOut), blind stripes sweep, desk warms, screen shows the week
      const M = F(65), MD = F(20), EXPO = "expo.inOut";
      tl.to("#root", { backgroundColor: "#fafaf9", duration: MD, ease: EXPO }, M);
      tl.to("#wall", { backgroundColor: "#f5f3ef", duration: MD, ease: EXPO }, M);
      tl.to("#window", { backgroundColor: "#fffdf8", duration: MD, ease: EXPO }, M);
      tl.to("#slats", { background: "repeating-linear-gradient(180deg,rgba(233,201,168,.55) 0 6px,transparent 6px 11px)", duration: MD, ease: EXPO }, M);
      tl.to("#desk", { backgroundColor: "#efebe5", duration: MD, ease: EXPO }, M);
      tl.to("#desk-edge", { backgroundColor: "#e2ddd6", duration: MD, ease: EXPO }, M);
      tl.to("#street", { opacity: 0, duration: F(8), ease: "power1.inOut" }, M);
      tl.fromTo("#stripes", { opacity: 0, xPercent: -22 }, { opacity: 0.55, xPercent: 0, duration: MD, ease: "power2.inOut" }, M);
      tl.to("#spill", { opacity: 0, duration: F(10), ease: "power1.inOut" }, M);
      tl.to("#book", { backgroundColor: "#d9d2c8", boxShadow: "0 18px 26px -14px rgba(12,10,9,.18)", duration: MD, ease: EXPO }, M);
      tl.to("#book .spine", { backgroundColor: "#cfc7bc", duration: MD, ease: EXPO }, M);
      tl.to("#book .band", { backgroundColor: "#c7beb2", duration: MD, ease: EXPO }, M);
      tl.to("#pen", { backgroundColor: "#4f6f5c", duration: MD, ease: EXPO }, M);
      tl.to("#pot .rim, #pot .body", { backgroundColor: "#d8d0c5", duration: MD, ease: EXPO }, M);
      tl.to("#pot .leaf", { backgroundColor: "#93b59d", duration: MD, ease: EXPO }, M);
      tl.to("#phone", { backgroundColor: "#e7e5e4", boxShadow: "0 0 0 1px #d6d3d1, 0 26px 34px -18px rgba(12,10,9,.22)", duration: MD, ease: EXPO }, M);
      tl.to("#week", { opacity: 1, duration: F(6), ease: "power1.inOut" }, F(68));
      tl.to("#lock", { opacity: 0, duration: F(3), ease: "power1.in" }, F(66));
      tl.to("#vig-night", { opacity: 0, duration: MD, ease: EXPO }, M);
      tl.to("#vig-day", { opacity: 1, duration: MD, ease: EXPO }, M);

      // 85-89 hold on the calm morning
      tl.set({}, {}, 3);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
