<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=1000" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face{font-family:"Geist";font-weight:100 900;src:url("assets/fonts/geist.woff2") format("woff2")}
      /* brand hex from src/app/globals.css (light + dark tokens); kept inside the composition only */
      :root{
        --night:#0c0a09;--night-card:#171412;--night-border:#292524;--night-ink:#f5f5f4;
        --morning:#fafaf9;--card:#ffffff;--border:#e7e5e4;--ink:#0c0a09;--muted:#6b6560;
        --sage:#4f6f5c;--sage-night:#93b59d;--sage-soft:#dfe8df;--sand:#e9c9a8;
      }
      *{margin:0;padding:0;box-sizing:border-box}
      html,body{width:1600px;height:1000px;overflow:hidden;background:var(--night)}
      #root{position:relative;width:100%;height:100%;overflow:hidden;font-family:"Geist",sans-serif}
      .full{position:absolute;inset:0}
      #night{background:radial-gradient(70% 60% at 50% 46%,#1a1714 0%,var(--night) 70%)}
      #dawn{background:radial-gradient(90% 80% at 70% 20%,var(--sand) 0%,transparent 60%);opacity:0}
      #morning{background:var(--morning);opacity:0}
      /* desk edge: a soft horizon under the phone */
      #desk{position:absolute;left:0;right:0;top:640px;bottom:0;background:linear-gradient(#14110f,#0f0d0b)}
      #glow{position:absolute;left:560px;top:120px;width:480px;height:760px;border-radius:50%;
        background:radial-gradient(closest-side,rgb(147 181 157 / .28),transparent);opacity:0}
      #phone{position:absolute;left:640px;top:150px;width:320px;height:660px;border-radius:52px;padding:12px;
        background:#1c1917;box-shadow:0 0 0 1px #292524,0 60px 120px -30px rgb(0 0 0 / .8)}
      #screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:#050404}
      #lit{position:absolute;inset:0;background:linear-gradient(180deg,#1f2a24 0%,#121815 100%);opacity:0}
      #time{position:absolute;left:0;right:0;top:78px;text-align:center;color:var(--night-ink);
        font:200 76px/1 "Geist";letter-spacing:-.04em;opacity:0}
      #bubble{position:absolute;left:22px;right:22px;top:250px;padding:16px 18px;border-radius:20px;
        background:var(--sage);color:#fff;font:500 17px/1.35 "Geist";opacity:0}
      #bubble small{display:block;font:500 12px/1 "Geist";opacity:.75;margin-bottom:8px}
      #card{position:absolute;left:22px;right:22px;top:380px;padding:18px;border-radius:18px;
        background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--border),0 24px 40px -20px rgb(0 0 0 / .45);opacity:0}
      #card .k{font:500 12px/1 "Geist";color:var(--sage);margin-bottom:10px}
      #card .v{font:600 22px/1.1 "Geist";letter-spacing:-.02em}
      #card .m{font:500 14px/1 "Geist";color:var(--muted);margin-top:8px}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1600" data-height="1000" data-duration="3" data-fps="30">
      <div id="sky" class="full clip" data-start="0" data-duration="3" data-track-index="0">
        <div id="night" class="full"></div>
        <div id="dawn" class="full"></div>
        <div id="morning" class="full"></div>
        <div id="desk"></div>
      </div>
      <div id="device" class="full clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="glow"></div>
        <div id="phone"><div id="screen">
          <div id="lit"></div>
          <div id="time">2:14</div>
          <div id="bubble"><small>WhatsApp</small>Hi, can I book a cleaning tomorrow?</div>
          <div id="card"><div class="k">Booked</div><div class="v">Sun 10:30 am</div><div class="m">Cleaning, 45 min</div></div>
        </div></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // 0.3 phone wakes at 2:14 am
      tl.to("#lit", { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.3);
      tl.to("#glow", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.3);
      tl.fromTo("#time", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.4);
      // 0.8 the patient's message rises
      tl.fromTo("#bubble", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.8);
      // 1.4 the booking card lands
      tl.fromTo("#card", { opacity: 0, y: -60, scale: 1.06 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 1.4);
      // 1.6 night warms into morning stone
      tl.to("#dawn", { opacity: 0.55, duration: 0.7, ease: "power1.inOut" }, 1.6);
      tl.to("#desk", { opacity: 0, duration: 0.9, ease: "power1.inOut" }, 1.7);
      tl.to("#morning", { opacity: 1, duration: 1.0, ease: "power2.inOut" }, 1.9);
      tl.to("#glow", { opacity: 0, duration: 0.6, ease: "power1.inOut" }, 1.9);
      tl.to("#phone", { backgroundColor: "#e7e5e4", boxShadow: "0 0 0 1px #e7e5e4, 0 40px 80px -40px rgba(12,10,9,.25)", duration: 1.0, ease: "power2.inOut" }, 1.9);
      tl.to("#lit", { background: "linear-gradient(180deg,#ffffff 0%,#f5f5f4 100%)", duration: 1.0, ease: "power2.inOut" }, 1.9);
      tl.to("#time", { color: "#0c0a09", duration: 1.0, ease: "power2.inOut" }, 1.9);
      tl.set({}, {}, 3);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
